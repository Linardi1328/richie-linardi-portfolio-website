<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#0f1b33" />
    </linearGradient>
    <pattern id="lpGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#172554" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#lpBg)" />
  <rect width="800" height="450" fill="url(#lpGrid)" opacity="0.6" />
  <rect x="15" y="15" width="770" height="420" rx="8" fill="none" stroke="#1e3a8a" stroke-width="1" />

  <text x="35" y="48" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="2">HUMAN-IN-THE-LOOP ACCOUNTING PIPELINE</text>
  <text x="35" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">LedgerPilot AI · Controlled Review &amp; Reconciliation</text>
  <rect x="590" y="35" width="175" height="26" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1" />
  <circle cx="603" cy="48" r="4" fill="#38bdf8" />
  <text x="613" y="52" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="600">HUMAN AUTHORITY GATE</text>

  <!-- Step 1 -->
  <g transform="translate(35, 95)">
    <rect width="110" height="200" rx="6" fill="#0b1329" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="55" cy="35" r="18" fill="#1e3a8a" />
    <text x="55" y="40" fill="#93c5fd" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="55" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Evidence Intake</text>
    <text x="55" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Invoices,</text>
    <text x="55" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">receipts &amp;</text>
    <text x="55" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">statements</text>
    <rect x="10" y="160" width="90" height="24" rx="3" fill="#1e293b" />
    <text x="55" y="176" fill="#60a5fa" font-family="monospace" font-size="9" text-anchor="middle">Document Data</text>
  </g>

  <path d="M 150 195 L 162 195" stroke="#3b82f6" stroke-width="2" />

  <!-- Step 2 -->
  <g transform="translate(165, 95)">
    <rect width="110" height="200" rx="6" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="55" cy="35" r="18" fill="#0369a1" />
    <text x="55" y="40" fill="#bae6fd" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="55" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rule Validation</text>
    <text x="55" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Vendor check,</text>
    <text x="55" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">duplicates &amp;</text>
    <text x="55" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">threshold rules</text>
    <rect x="10" y="160" width="90" height="24" rx="3" fill="#1e293b" />
    <text x="55" y="176" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Rule Engine</text>
  </g>

  <path d="M 280 195 L 292 195" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 3 -->
  <g transform="translate(295, 95)">
    <rect width="110" height="200" rx="6" fill="#0b1329" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="55" cy="35" r="18" fill="#78350f" />
    <text x="55" y="40" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="55" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Recommendation</text>
    <text x="55" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Account code</text>
    <text x="55" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">draft &amp; confidence</text>
    <text x="55" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">scoring</text>
    <rect x="10" y="160" width="90" height="24" rx="3" fill="#1e293b" />
    <text x="55" y="176" fill="#fbbf24" font-family="monospace" font-size="9" text-anchor="middle">Advisory Only</text>
  </g>

  <path d="M 410 195 L 422 195" stroke="#f59e0b" stroke-width="2" />

  <!-- Step 4 -->
  <g transform="translate(425, 95)">
    <rect width="110" height="200" rx="6" fill="#0b1329" stroke="#10b981" stroke-width="2" />
    <circle cx="55" cy="35" r="18" fill="#064e3b" />
    <text x="55" y="40" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="55" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Human Review</text>
    <text x="55" y="105" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="650">Reviewer checks,</text>
    <text x="55" y="120" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="650">edits, approves</text>
    <text x="55" y="135" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="650">or blocks</text>
    <rect x="10" y="160" width="90" height="24" rx="3" fill="#065f46" />
    <text x="55" y="176" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">SOLE AUTHORITY</text>
  </g>

  <path d="M 540 195 L 552 195" stroke="#10b981" stroke-width="2" />

  <!-- Step 5 -->
  <g transform="translate(555, 95)">
    <rect width="100" height="200" rx="6" fill="#0b1329" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="50" cy="35" r="18" fill="#312e81" />
    <text x="50" y="40" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="50" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Audit Trail</text>
    <text x="50" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Traceable log:</text>
    <text x="50" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">reviewer, time,</text>
    <text x="50" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">before vs after</text>
    <rect x="8" y="160" width="84" height="24" rx="3" fill="#1e293b" />
    <text x="50" y="176" fill="#a5b4fc" font-family="monospace" font-size="9" text-anchor="middle">Audit Evidence</text>
  </g>

  <path d="M 660 195 L 672 195" stroke="#6366f1" stroke-width="2" />

  <!-- Step 6 -->
  <g transform="translate(675, 95)">
    <rect width="90" height="200" rx="6" fill="#0b1329" stroke="#10b981" stroke-width="1.2" />
    <circle cx="45" cy="35" r="18" fill="#064e3b" />
    <text x="45" y="40" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">6</text>
    <text x="45" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reconcile</text>
    <text x="45" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reconciliation</text>
    <text x="45" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">foundation &amp;</text>
    <text x="45" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">export records</text>
    <rect x="6" y="160" width="78" height="24" rx="3" fill="#1e293b" />
    <text x="45" y="176" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle">Export Ready</text>
  </g>

  <g transform="translate(35, 320)">
    <rect width="730" height="85" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="24" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Deterministic Operational Boundaries</text>
    <text x="24" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AI and rule output remains recommendation input until an authorized human outcome exists.</text>
    <text x="24" y="68" fill="#64748b" font-family="monospace" font-size="9">No autonomous payments · No supplier-bank-detail modifications · Bank reconciliation foundation</text>
  </g>
</svg>