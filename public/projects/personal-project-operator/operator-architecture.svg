<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ppoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b121e" />
      <stop offset="100%" stop-color="#132035" />
    </linearGradient>
    <pattern id="ppoGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#ppoBg)" />
  <rect width="800" height="450" fill="url(#ppoGrid)" opacity="0.6" />
  <rect x="15" y="15" width="770" height="420" rx="8" fill="none" stroke="#334155" stroke-width="1" />

  <text x="35" y="48" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="2">PROJECT COMMAND CENTER ARCHITECTURE</text>
  <text x="35" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Personal Project Operator · GitHub State &amp; Write Gates</text>
  <rect x="585" y="35" width="180" height="26" rx="4" fill="#032b1b" stroke="#10b981" stroke-width="1" />
  <circle cx="598" cy="48" r="4" fill="#10b981" />
  <text x="608" y="52" fill="#34d399" font-family="monospace" font-size="10" font-weight="600">PHASE 6 COMPLETE</text>

  <!-- Col 1 -->
  <g transform="translate(35, 95)">
    <rect width="160" height="200" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <text x="14" y="28" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="700">01 · OPERATOR UI</text>
    <text x="14" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Phone Control</text>
    <text x="14" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Telegram Bot &amp;</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">OpenClaw Command</text>
    <text x="14" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Interface</text>
    <rect x="14" y="145" width="132" height="35" rx="4" fill="#1e293b" />
    <text x="80" y="166" fill="#93c5fd" font-family="monospace" font-size="9" text-anchor="middle">Operator Control</text>
  </g>

  <path d="M 200 195 L 220 195" stroke="#38bdf8" stroke-width="2" />

  <!-- Col 2 -->
  <g transform="translate(225, 95)">
    <rect width="160" height="200" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="28" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">02 · GITHUB STATE</text>
    <text x="14" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Source of Truth</text>
    <text x="14" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Live GitHub API:</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Repositories, commits,</text>
    <text x="14" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PR reviews, actions</text>
    <rect x="14" y="145" width="132" height="35" rx="4" fill="#0369a1" />
    <text x="80" y="166" fill="#e0f2fe" font-family="monospace" font-size="9" text-anchor="middle" font-weight="600">GROUNDED STATE</text>
  </g>

  <path d="M 390 195 L 410 195" stroke="#38bdf8" stroke-width="2" />

  <!-- Col 3 -->
  <g transform="translate(415, 95)">
    <rect width="160" height="200" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="14" y="28" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">03 · WRITE GATE</text>
    <text x="14" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Approval Contract</text>
    <text x="14" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Explicit human</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">approval required</text>
    <text x="14" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">for all writes</text>
    <rect x="14" y="145" width="132" height="35" rx="4" fill="#064e3b" />
    <text x="80" y="166" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">EXPLICIT WRITES</text>
  </g>

  <path d="M 580 195 L 600 195" stroke="#10b981" stroke-width="2" />

  <!-- Col 4 -->
  <g transform="translate(605, 95)">
    <rect width="160" height="200" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="14" y="28" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">04 · LIFECYCLE</text>
    <text x="14" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Bounded Run</text>
    <text x="14" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Isolated context,</text>
    <text x="14" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">test contracts,</text>
    <text x="14" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">user acceptance</text>
    <rect x="14" y="145" width="132" height="35" rx="4" fill="#312e81" />
    <text x="80" y="166" fill="#c7d2fe" font-family="monospace" font-size="9" text-anchor="middle" font-weight="600">TESTED LIFECYCLE</text>
  </g>

  <g transform="translate(35, 315)">
    <rect width="730" height="90" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Deterministic Planning &amp; Operational Safety</text>
    <text x="24" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Production operations remain separately permission-gated. External writes use explicit approval contracts rather than implicit agent autonomy. GitHub remains the project source of truth.</text>
    <text x="24" y="68" fill="#64748b" font-family="monospace" font-size="9">Node.js · GitHub Octokit · Telegram Bot API · Automation &amp; Testing Contracts</text>
  </g>
