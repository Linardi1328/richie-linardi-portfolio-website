name: Prettier report

on:
  push:
    branches:
      - prod/04-signature-flipbook

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format signature files
        run: npx prettier --write src/components/interaction/signature-flipbook.tsx src/styles/signature-flipbook.css

      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- src/components/interaction/signature-flipbook.tsx src/styles/signature-flipbook.css; then
            echo "Signature files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/interaction/signature-flipbook.tsx src/styles/signature-flipbook.css
          git commit -m "chore: format signature flipbook"
          git push origin HEAD:prod/04-signature-flipbook
