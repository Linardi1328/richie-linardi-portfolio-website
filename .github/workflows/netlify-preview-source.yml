name: Netlify Preview Source

on:
  push:
    branches:
      - prod/03-preview-ready-foundation

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle preview source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=out \
            -czf /tmp/netlify-preview-source.tgz .
          mv /tmp/netlify-preview-source.tgz ./netlify-preview-source.tgz

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-preview-source
          path: netlify-preview-source.tgz
          if-no-files-found: error
          retention-days: 1
