name: Compliance format preview

on:
  push:
    branches:
      - compliance/legal-accessibility-hardening

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write \
            src/app/cookies/page.tsx \
            src/app/privacy/page.tsx \
            src/app/refunds/page.tsx \
            src/app/terms/page.tsx \
            src/components/legal/legal-page.tsx
          git diff -- \
            src/app/cookies/page.tsx \
            src/app/privacy/page.tsx \
            src/app/refunds/page.tsx \
            src/app/terms/page.tsx \
            src/components/legal/legal-page.tsx
