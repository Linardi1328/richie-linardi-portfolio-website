name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format design reference docs
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/design-reference-library'
        shell: bash
        run: |
          npx prettier --write \
            docs/design-references/BRAINSTORM.md \
            docs/design-references/PROJECTS_OVERVIEW_FINAL.md

          if git diff --quiet -- \
            docs/design-references/BRAINSTORM.md \
            docs/design-references/PROJECTS_OVERVIEW_FINAL.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/design-references/BRAINSTORM.md \
            docs/design-references/PROJECTS_OVERVIEW_FINAL.md
          git commit -m "style: format design reference docs"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run validation
        run: npm run validate

      - name: Smoke test production server
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/portfolio-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null && \
               curl --fail --silent --show-error http://127.0.0.1:3000/design-system > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/portfolio-next.log
          exit 1
