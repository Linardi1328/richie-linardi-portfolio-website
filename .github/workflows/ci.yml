name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

      - name: Smoke test production route matrix
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/portfolio-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/portfolio-next.log
            exit 1
          fi

          routes=(
            "/"
            "/about"
            "/projects"
            "/projects/spy-market-agent"
            "/projects/personal-project-operator"
            "/projects/ledgerpilot-ai"
            "/projects/khlim-assist"
            "/projects/rbl-content-engine"
            "/projects/khlim-digital-ecosystem"
            "/experience"
            "/education"
            "/resume"
            "/contact"
            "/journey"
            "/basketball"
            "/basketball/journey"
            "/basketball/achievements"
            "/basketball/stats"
            "/basketball/gallery"
            "/basketball/media"
            "/design-system"
            "/robots.txt"
          )

          for route in "${routes[@]}"; do
            echo "Smoke testing $route"
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000${route}" > /dev/null; then
              cat /tmp/portfolio-next.log
              exit 1
            fi
          done

          not_found_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://127.0.0.1:3000/__production-smoke-missing__)

          if [ "$not_found_status" != "404" ]; then
            echo "Expected 404 for missing route, got $not_found_status"
            cat /tmp/portfolio-next.log
            exit 1
          fi
