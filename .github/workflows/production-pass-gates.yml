name: Production Pass Gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pass-gate:
    name: Required production gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate

      - name: Check diff whitespace
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Verify production contracts
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "ROADMAP.md"
            "docs/ANTIGRAVITY_COLLABORATION.md"
            "docs/FRONTEND_REFERENCE_RESEARCH.md"
            "docs/design-references/RESPONSIVE_IMPLEMENTATION_REQUIREMENTS.md"
            "src/data/project-registry.ts"
            "src/types/project.ts"
            ".agents/agents/rbl-frontend-implementer/agent.md"
            ".agents/agents/rbl-responsive-reviewer/agent.md"
            ".agents/agents/rbl-visual-diff-reviewer/agent.md"
            ".agents/agents/rbl-accessibility-reviewer/agent.md"
            ".agents/agents/rbl-content-truth-guard/agent.md"
          )

          for path in "${required_paths[@]}"; do
            test -f "$path" || {
              echo "Missing required production contract: $path"
              exit 1
            }
          done

          if grep -R --line-number --fixed-strings "Healthy Bite" src; then
            echo "Forbidden legacy project content found under src/."
            exit 1
          fi

          if grep -R --line-number --fixed-strings "ProofLab" src; then
            echo "Hidden project content found under src/."
            exit 1
          fi

          echo "Production contracts verified."
