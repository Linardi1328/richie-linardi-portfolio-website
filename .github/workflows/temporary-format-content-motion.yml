name: Temporary format content motion

on:
  push:
    branches:
      - prod/03-preview-ready-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: prod/03-preview-ready-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format content and motion pass"
          git push origin HEAD:prod/03-preview-ready-foundation
